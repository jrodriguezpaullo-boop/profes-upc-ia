<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Profes UPC</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 25px; }
        .card { background: white; width: 100%; max-width: 720px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 28px; }
        h2 { color: #d50000; margin-top: 0; text-align: center; }
        .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
        .tab { flex: 1; padding: 10px; border: 1px solid #ddd; background: #f9f9f9; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 14px; }
        .tab.active { background: #d50000; color: white; border-color: #d50000; }
        .form-group { margin-bottom: 12px; }
        input, select, textarea { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; font-family: inherit; }
        button.primary { width: 100%; background: #d50000; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; margin-top: 6px; }
        button.primary:hover { background: #b71c1c; }
        .error { color: #d50000; font-size: 14px; margin-top: 10px; text-align: center; font-weight: bold; }
        .success { color: #2e7d32; font-size: 14px; margin-top: 10px; text-align: center; font-weight: bold; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .logout { background: #555; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .docente-item { border: 1px solid #e0e0e0; border-radius: 8px; padding: 14px; margin-bottom: 12px; background: #fafafa; }
        .docente-header { display: flex; justify-content: space-between; align-items: center; }
        .docente-nombre { font-weight: bold; font-size: 17px; color: #222; }
        .badge { background: #ffe082; color: #5d4037; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 14px; }
        .cursos { color: #555; font-size: 14px; margin: 6px 0; }
        .opinion-box { background: white; border-left: 3px solid #d50000; padding: 6px 10px; margin-top: 6px; font-size: 13px; color: #444; }
        #chat { height: 290px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
        .msg { margin-bottom: 10px; line-height: 1.4; white-space: pre-wrap; }
        .user { color: #1a73e8; font-weight: bold; }
        .bot { color: #222; background: #eef2f7; padding: 8px 12px; border-radius: 8px; }
        .row { display: flex; gap: 8px; }
        .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .chip { background: #eee; border: none; padding: 6px 10px; border-radius: 15px; font-size: 12px; cursor: pointer; color: #333; }
    </style>
</head>
<body>
    <div class="card" id="auth-card" style="max-width: 460px; margin-top: 40px;">
        <h2>Calificación de Profes UPC</h2>
        <div class="tabs">
            <button type="button" class="tab active" id="tab-login" onclick="mostrarAuth('login')">Iniciar Sesión</button>
            <button type="button" class="tab" id="tab-reg" onclick="mostrarAuth('reg')">Registrarse</button>
        </div>

        <form id="form-login" onsubmit="hacerLogin(event)">
            <div class="form-group"><input type="email" id="login-correo" placeholder="Correo institucional (ej. u2023@upc.edu.pe)" required></div>
            <div class="form-group"><input type="password" id="login-pass" placeholder="Contraseña" required></div>
            <button type="submit" class="primary">Ingresar a la Plataforma</button>
        </form>

        <form id="form-reg" style="display:none;" onsubmit="hacerRegistro(event)">
            <div class="form-group"><input type="text" id="reg-nombre" placeholder="Tu nombre completo" required></div>
            <div class="form-group"><input type="email" id="reg-correo" placeholder="Correo institucional" required></div>
            <div class="form-group"><input type="password" id="reg-pass" placeholder="Crea una contraseña" required></div>
            <button type="submit" class="primary">Crear Cuenta</button>
        </form>
        <div id="auth-msg" class="error"></div>
    </div>

    <div class="card" id="app-card" style="display:none;">
        <div class="topbar">
            <span id="saludo-usuario" style="font-weight:bold; color:#333;">Estudiante</span>
            <button type="button" class="logout" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
        <h2>Plataforma de Calificación de Docentes UPC</h2>
        
        <div class="tabs">
            <button type="button" class="tab active" id="nav-lista" onclick="cambiarSeccion('lista')">Docentes y Reseñas</button>
            <button type="button" class="tab" id="nav-opinar" onclick="cambiarSeccion('opinar')">Calificar Docente</button>
            <button type="button" class="tab" id="nav-ia" onclick="cambiarSeccion('ia')">Asistente IA</button>
        </div>

        <div id="sec-lista">
            <div class="form-group">
                <input type="text" id="buscador" placeholder="Buscar profesor o curso..." onkeyup="filtrarDocentes()">
            </div>
            <div id="contenedor-docentes">Cargando docentes...</div>
        </div>

        <div id="sec-opinar" style="display:none;">
            <div class="form-group">
                <label style="font-weight:bold; font-size:14px;">Selecciona al docente:</label>
                <select id="select-docente"></select>
            </div>
            <div class="form-group">
                <label style="font-weight:bold; font-size:14px;">Calificación (1 a 5 estrellas):</label>
                <select id="select-puntaje">
                    <option value="5">5 - Excelente</option>
                    <option value="4">4 - Muy bueno</option>
                    <option value="3">3 - Regular</option>
                    <option value="2">2 - Deficiente</option>
                    <option value="1">1 - Muy malo</option>
                </select>
            </div>
            <div class="form-group">
                <label style="font-weight:bold; font-size:14px;">Tu comentario sobre su clase:</label>
                <textarea id="input-comentario" rows="3" placeholder="¿Qué tal explica? ¿Cómo evalúa?"></textarea>
            </div>
            <button type="button" class="primary" onclick="enviarOpinion()">Publicar Calificación</button>
            <div id="op-msg" class="success"></div>
        </div>

        <div id="sec-ia" style="display:none;">
            <div class="chips">
                <button type="button" class="chip" onclick="preguntar('¿Cuál es el Top 5 de mejores profesores?')">Top 5 mejores profes</button>
                <button type="button" class="chip" onclick="preguntar('¿Quién es el mejor profesor de Cálculo?')">Mejor de Cálculo</button>
                <button type="button" class="chip" onclick="preguntar('¿Quién enseña mejor Algoritmos?')">Mejor de Algoritmos</button>
            </div>
            <div id="chat">
                <div class="msg bot">¡Hola! Soy el asistente IA de Profes UPC. Pregúntame por el Top 5 general o por el mejor profesor de cualquier curso.</div>
            </div>
            <div class="row">
                <input type="text" id="texto" placeholder="Escribe tu pregunta aquí..." onkeypress="if(event.key==='Enter') enviarChat()">
                <button type="button" class="primary" style="width:auto; margin-top:0; padding:10px 18px;" onclick="enviarChat()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        var usuarioActual = {id: '1', nombre: ''};
        var listaDocentesGlobal = [];

        function mostrarAuth(tipo) {
            document.getElementById('auth-msg').innerText = '';
            document.getElementById('tab-login').classList.toggle('active', tipo === 'login');
            document.getElementById('tab-reg').classList.toggle('active', tipo === 'reg');
            document.getElementById('form-login').style.display = tipo === 'login' ? 'block' : 'none';
            document.getElementById('form-reg').style.display = tipo === 'reg' ? 'block' : 'none';
        }

        async function hacerRegistro(e) {
            e.preventDefault();
            var nombre = document.getElementById('reg-nombre').value;
            var correo = document.getElementById('reg-correo').value;
            var contrasena = document.getElementById('reg-pass').value;
            var msg = document.getElementById('auth-msg');
            msg.className = 'success';
            msg.innerText = 'Creando cuenta...';
            try {
                var res = await fetch('/registrar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({nombre: nombre, correo: correo, contrasena: contrasena})
                });
                var data = await res.json();
                if (!res.ok) { msg.className = 'error'; msg.innerText = data.detail || 'Error al registrar'; return; }
                msg.className = 'success';
                msg.innerText = data.mensaje;
                setTimeout(function() { mostrarAuth('login'); }, 1200);
            } catch (err) {
                msg.className = 'error';
                msg.innerText = 'Error de conexión con el servidor.';
            }
        }

        async function hacerLogin(e) {
            e.preventDefault();
            var correo = document.getElementById('login-correo').value;
var contrasena = document.getElementById('login-pass').value;
var msg = document.getElementById('auth-msg');
msg.className = 'success';
msg.innerText = 'Verificando...';
try {
var res = await fetch('/login', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({correo: correo, contrasena: contrasena})
});
var data = await res.json();
if (!res.ok) { msg.className = 'error'; msg.innerText = data.detail || 'Correo o contraseña incorrectos'; return; }
usuarioActual = data;
document.getElementById('auth-card').style.display = 'none';
document.getElementById('app-card').style.display = 'block';
document.getElementById('saludo-usuario').innerText = 'Estudiante: ' + data.nombre;
cargarDocentes();
} catch (err) {
msg.className = 'error';
msg.innerText = 'Error de conexión con el servidor.';
}
}
function cerrarSesion() {
document.getElementById('app-card').style.display = 'none';
document.getElementById('auth-card').style.display = 'block';
document.getElementById('login-pass').value = '';
document.getElementById('auth-msg').innerText = '';
}
function cambiarSeccion(sec) {
['lista', 'opinar', 'ia'].forEach(function(s) {
document.getElementById('sec-' + s).style.display = s === sec ? 'block' : 'none';
document.getElementById('nav-' + s).classList.toggle('active', s === sec);
});
if (sec === 'lista') cargarDocentes();
}
async function cargarDocentes() {
var res = await fetch('/api/docentes');
listaDocentesGlobal = await res.json();
renderizarDocentes(listaDocentesGlobal);
var select = document.getElementById('select-docente');
select.innerHTML = listaDocentesGlobal.map(function(d) {
return '' + d.nombre + ' (' + d.cursos.join(', ') + ')';
}).join('');
}
function filtrarDocentes() {
var q = document.getElementById('buscador').value.toLowerCase();
var filtrados = listaDocentesGlobal.filter(function(d) {
return d.nombre.toLowerCase().indexOf(q) !== -1 || d.cursos.some(function(c) { return c.toLowerCase().indexOf(q) !== -1; });
});
renderizarDocentes(filtrados);
}
function renderizarDocentes(lista) {
var cont = document.getElementById('contenedor-docentes');
if (!lista.length) { cont.innerHTML = 'No se encontraron docentes.'; return; }
cont.innerHTML = lista.map(function(d) {
var ops = d.opiniones.map(function(op) {
return '' + op.puntaje + '/5 — "' + op.comentario + '"';
}).join('');
return '' +
'' +
'' + d.nombre + '' +
'' + d.puntaje_general + ' / 5.0 (' + d.opiniones.length + ' reseñas)' +
'' +
'Cursos: ' + d.cursos.join(', ') + '' +
ops +
'';
}).join('');
}
async function enviarOpinion() {
var docente_id = document.getElementById('select-docente').value;
var puntaje = parseInt(document.getElementById('select-puntaje').value);
var comentario = document.getElementById('input-comentario').value;
var msg = document.getElementById('op-msg');
var res = await fetch('/api/opiniones', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({estudiante_id: usuarioActual.id, docente_id: docente_id, puntaje: puntaje, comentario: comentario})
});
var data = await res.json();
if (!res.ok) { msg.className = 'error'; msg.innerText = data.detail; return; }
msg.className = 'success';
msg.innerText = data.mensaje;
document.getElementById('input-comentario').value = '';
cargarDocentes();
setTimeout(function() { msg.innerText = ''; cambiarSeccion('lista'); }, 1200);
}
function preguntar(txt) { document.getElementById('texto').value = txt; enviarChat(); }
async function enviarChat() {
var input = document.getElementById('texto');
var chat = document.getElementById('chat');
var pregunta = input.value.trim();
if (!pregunta) return;
chat.innerHTML += 'Tú: ' + pregunta + '';
input.value = '';
var res = await fetch('/preguntar', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({pregunta: pregunta})
});
var data = await res.json();
chat.innerHTML += 'IA: ' + data.respuesta + '';
chat.scrollTop = chat.scrollHeight;
}
